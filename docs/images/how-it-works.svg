<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t">
  <title id="t">How flagpact works: resolve each version's value, replay its tests, and if any version breaks generate a protective segment, then publish</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b98a7"/>
    </marker>
    <style>
      .b { fill: #14181f; stroke: #2f3a46; stroke-width: 1.5; }
      .g { fill: #0f2a1b; stroke: #22c55e; stroke-width: 1.5; }
      .r { fill: #2a1414; stroke: #ef4444; stroke-width: 1.5; }
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #e6edf3; text-anchor: middle; }
      .s { font-size: 12px; fill: #8b98a7; }
      .l { stroke: #8b98a7; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="300" rx="12" fill="#0d1117"/>

  <rect class="b" x="20" y="40" width="190" height="64" rx="10"/>
  <text x="115" y="68">Pending config</text><text x="115" y="88">value</text>
  <rect class="b" x="250" y="40" width="240" height="64" rx="10"/>
  <text x="370" y="68">Resolve each version's</text><text x="370" y="88">value through segments</text>
  <rect class="b" x="530" y="40" width="190" height="64" rx="10"/>
  <text x="625" y="68">Replay each version's</text><text x="625" y="88">own tests</text>
  <rect class="b" x="760" y="40" width="210" height="64" rx="10"/>
  <text x="865" y="78">Does any version break?</text>

  <path class="l" d="M210 72H248"/>
  <path class="l" d="M490 72H528"/>
  <path class="l" d="M720 72H758"/>

  <rect class="r" x="250" y="190" width="240" height="64" rx="10"/>
  <text x="370" y="218">Generate a segment: older</text><text x="370" y="238">versions keep the live value</text>
  <rect class="b" x="530" y="190" width="190" height="64" rx="10"/>
  <text x="625" y="218">Optional: rehearse</text><text x="625" y="238">on a clone</text>
  <rect class="g" x="760" y="190" width="210" height="64" rx="10"/>
  <text x="865" y="228">Publish</text>

  <path class="l" d="M900 104V188"/>
  <text class="s" x="920" y="150">no</text>
  <path class="l" d="M790 104V147H370V188"/>
  <text class="s" x="580" y="140">yes</text>
  <path class="l" d="M490 222H528"/>
  <path class="l" d="M720 222H758"/>
</svg>
